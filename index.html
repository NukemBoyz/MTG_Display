<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTG Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top-bar">
    <div class="page-heading">
      <div class="page-title" id="pageTitle">Matches 1-5</div>
    </div>
    <div class="actions">
      <button id="displayModeBtn" type="button">Full Screen</button>
      <button id="operatorBtn" type="button">Operator</button>
    </div>
  </header>

  <main>
    <section id="matches" class="matches" aria-label="Magic the Gathering matches"></section>
    <div class="empty-state" id="emptyState" hidden>
      No active matches. Un-hide a match from the Operator window to show it here.
    </div>
  </main>

  <template id="matchTemplate">
    <article class="match-card" data-match>
      <div class="match-header">
        <div class="match-title-group">
          <div class="match-title-display" data-match-title-display>Match</div>
          <label>
            Match
            <input class="match-title" type="text" maxlength="30" />
          </label>
        </div>
        <div class="match-actions">
          <button class="reset-match" type="button">Reset</button>
          <button class="toggle-visibility" type="button">Hide</button>
        </div>
      </div>

      <div class="players">
        <section class="player" data-player="1">
          <div class="player-qr">
            <img class="player-qr-image" data-player-qr alt="Player QR code" />
            <a class="phone-link" data-phone-link href="#">Player 1 Phone</a>
            <div class="player-qr-url" data-player-qr-url></div>
          </div>
          <div class="player-name-display" data-player-name-display>Player 1</div>
          <label>
            Player 1
            <input class="player-name" type="text" maxlength="25" />
          </label>
          <div class="life-total" data-life-total>20</div>
          <div class="life-controls">
            <button class="life-btn" data-change="-5" type="button">-5</button>
            <button class="life-btn" data-change="-1" type="button">-1</button>
            <button class="life-btn" data-change="1" type="button">+1</button>
            <button class="life-btn" data-change="5" type="button">+5</button>
          </div>
        </section>

        <section class="player" data-player="2">
          <div class="player-qr">
            <img class="player-qr-image" data-player-qr alt="Player QR code" />
            <a class="phone-link" data-phone-link href="#">Player 2 Phone</a>
            <div class="player-qr-url" data-player-qr-url></div>
          </div>
          <div class="player-name-display" data-player-name-display>Player 2</div>
          <label>
            Player 2
            <input class="player-name" type="text" maxlength="25" />
          </label>
          <div class="life-total" data-life-total>20</div>
          <div class="life-controls">
            <button class="life-btn" data-change="-5" type="button">-5</button>
            <button class="life-btn" data-change="-1" type="button">-1</button>
            <button class="life-btn" data-change="1" type="button">+1</button>
            <button class="life-btn" data-change="5" type="button">+5</button>
          </div>
        </section>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
